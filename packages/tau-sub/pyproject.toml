[project]
name = "tau-sub"
version = "0.1.0"
description = "Sub-taus: small named specialists of your tau, each with its own persona, model role, tool allowlist and sessions."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["click>=8.1", "strands-agents>=1.57", "tau-core>=0.3.1"]
keywords = ["tau", "agent", "assistant", "specialist", "sub-agent", "strands", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
]

[project.urls]
Homepage = "https://github.com/fport/tau"
Documentation = "https://docs.tau.getporti.com"
Issues = "https://github.com/fport/tau/issues"
Changelog = "https://github.com/fport/tau/releases"

[project.entry-points."tau.commands"]
sub = "tau_sub.cli:sub"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tau_sub"]
