name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # no floating v10 tag is published
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv build --package tau-core
      - run: uv build --package tau-tui
      - run: uv build --package tau-net
      - run: uv build --package tau-cloud
      - run: uv build --package tau-guard
      - run: uv build --package tau-sim
      - run: uv build --package tau-web

  app:
    # apps/tau, the Mac app (roadmap 170): vitest, the type-checked page build, and the Rust tests
    # and lints (the hub supervisor, the chat windows' PTYs, sleep, login, bundle config). On
    # macOS, the app's platform: the supervisor, login item and bundle tests expect it. The
    # release bundle is built by app.yml on a tag.
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/tau
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2
      # bun installs and runs the scripts; Vitest and Vite run on Node, which `bun run` starts
      # through their `#!/usr/bin/env node` shebangs.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run test
      # tsc (the type check) and vite; it also makes the dist/ that Tauri's build script checks.
      - run: bun run build
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/tau/src-tauri/target/
          key: app-cargo-${{ runner.os }}-${{ hashFiles('apps/tau/src-tauri/Cargo.lock') }}
          restore-keys: app-cargo-${{ runner.os }}-
      - run: cargo test --locked
        working-directory: apps/tau/src-tauri
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: apps/tau/src-tauri

  # tau-net ships the spine Worker as a kit (packages/tau-net/src/tau_net/spine_kit/, used by
  # `tau net spine init`). It is generated from cloud/spine by `bun run kit` and tracked, so
  # a change to the spine without a fresh kit fails here.
  spine-kit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud/spine
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2
      # bun installs and runs the scripts; Wrangler (and Vitest) run on Node, which `bun run`
      # starts through their `#!/usr/bin/env node` shebangs.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('cloud/spine/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run kit
      - name: The tracked kit matches the build
        run: |
          kit=packages/tau-net/src/tau_net/spine_kit
          cd "$GITHUB_WORKSPACE"
          if [ -n "$(git status --porcelain -- "$kit")" ]; then
            git status --short -- "$kit"
            git diff --stat -- "$kit"
            echo "::error::$kit is stale: run \`bun run kit\` in cloud/spine and commit the result"
            exit 1
          fi

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # no floating v10 tag is published
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --only-group docs
      - run: uv run --no-sync mkdocs build --strict
