name: app

# Builds the tau Mac app (apps/tau; ADR 0014 §3, §4, §6; roadmap 170) for every version tag,
# uploads it to the public downloads (roadmap 190) and attaches it to the tag's GitHub release:
#
#   tau.dmg              the download: one universal app for Apple silicon and Intel
#   tau.app.tar.gz       the Tauri updater's archive of the same app
#   tau.app.tar.gz.sig   its updater signature, bound to the version (also inside latest.json)
#   latest.json          what installed apps read to find an update
#
# Public downloads: the repository is private, so release assets on GitHub are not reachable
# for visitors or for the updater. The `downloads` job puts the files into the R2 bucket
# tau-downloads, which the universe Worker serves (cloud/universe/src/downloads.ts):
#
#   https://tau.getporti.com/download/v<version>/tau.dmg          this release's files, first
#   https://tau.getporti.com/download/v<version>/tau.app.tar.gz
#   https://tau.getporti.com/download/tau.app.tar.gz              then the latest copies
#   https://tau.getporti.com/download/tau.dmg
#   https://tau.getporti.com/download/latest.json                 last: the updater's endpoint
#
# latest.json names the versioned archive, and it is uploaded only after that archive, so an
# upload that stops halfway never points installed apps at a missing file. A pre-release
# (0.5.0-rc1) gets only its versioned files. The GitHub release keeps a copy of everything,
# with the same latest.json. The upload needs two repository secrets:
#   CLOUDFLARE_ACCOUNT_ID   the Cloudflare account that has the bucket
#   CLOUDFLARE_API_TOKEN    a token with Account > Workers R2 Storage > Edit (and Workers Scripts
#                           > Edit, so docs.yml can deploy with the same token)
# Without them the job warns and uploads nothing; the build still passes.
#
# Signing: every build is signed with one stable self-signed code-signing identity, so its
# designated requirement stays the same from build to build and macOS keeps the camera and
# notification permissions across updates. No notarisation yet: Gatekeeper warns on first
# open, and apps/tau/README.md and the guide say how to open it. The signing and packing are in
# apps/tau/scripts/pack-release.sh, which runs the same on a Mac.
#
# One-time setup by the owner: apps/tau/scripts/make-signing-identity.sh creates the identity and
# the updater key in apps/tau/.signing/ (gitignored), writes the updater's public key into
# apps/tau/src-tauri/tauri.conf.json (commit it), and prints the commands that set these
# repository secrets:
#   MACOS_SIGNING_P12                    the code-signing identity, a base64 p12
#   MACOS_SIGNING_PASSWORD               its password
#   TAURI_SIGNING_PRIVATE_KEY            the updater's private key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD   its password
# Without them (a fork, say) the app is signed ad hoc and there are no updater files; the run
# says so in warnings and still succeeds.
#
# release.yml creates the release for the same tag after publishing to PyPI. Whichever workflow
# gets there first creates it; the other one uploads its files to it.
#
# A manual run (workflow_dispatch) is a dry run by default: build, sign and pack, keep the files
# as a workflow artifact, attach and upload nothing. To attach and upload by hand, pick the tag
# under "Use workflow from" and untick "dry run".

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build, sign and pack only; attach and upload nothing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, sign and pack tau.app
    runs-on: macos-15
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: apps/tau
    steps:
      - uses: actions/checkout@v7

      - name: The app's version from the tag
        id: version
        env:
          PUBLISH: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        run: |
          core="$(sed -n 's/^version = "\(.*\)"$/\1/p' ../../packages/tau-core/pyproject.toml | head -n 1)"
          echo "tau-core $core, ref $GITHUB_REF_TYPE $GITHUB_REF_NAME, publish=$PUBLISH"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$GITHUB_REF_NAME" != "v$core" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match packages/tau-core/pyproject.toml (version $core, expected tag v$core)"
              exit 1
            fi
          elif [ "$PUBLISH" = "true" ]; then
            echo "::error::attaching the app needs a v<version> tag, not $GITHUB_REF_TYPE $GITHUB_REF_NAME; run again as a dry run or push a tag"
            exit 1
          fi
          # The app carries tau-core's version as semver: 0.5.0 stays, 0.5.0rc1 becomes 0.5.0-rc1.
          version="$(printf '%s' "$core" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+)\.?([a-z].*)$/\1-\2/')"
          echo "app version $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2
      # bun installs and runs the scripts; Vitest, Vite and the Tauri CLI run on Node, which
      # `bun run` starts through their `#!/usr/bin/env node` shebangs.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Rust for both Mac architectures
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/tau/src-tauri/target/
          key: app-release-${{ runner.os }}-${{ hashFiles('apps/tau/src-tauri/Cargo.lock') }}
          restore-keys: app-release-${{ runner.os }}-

      - run: bun install --frozen-lockfile
      - run: bun run test

      # Tauri builds both architectures and joins them with lipo; the bundle is signed ad hoc
      # here and properly in the next step.
      - name: Build the universal app
        env:
          # Release builds look for updates by themselves (src-tauri/src/update.rs).
          TAU_APP_RELEASE: "1"
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bun run tauri build --ci --target universal-apple-darwin --bundles app \
            --config "{\"version\": \"$VERSION\"}"
          archs="$(lipo -archs src-tauri/target/universal-apple-darwin/release/bundle/macos/tau.app/Contents/MacOS/tau-app)"
          echo "architectures: $archs"
          for arch in x86_64 arm64; do
            case " $archs " in
              *" $arch "*) ;;
              *) echo "::error::tau.app is not universal: $archs"; exit 1 ;;
            esac
          done

      - name: Sign and pack
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # latest.json names https://tau.getporti.com/download/v<version>/tau.app.tar.gz (the
          # script's default TAU_DOWNLOAD_BASE), on GitHub too.
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          scripts/pack-release.sh src-tauri/target/universal-apple-darwin/release/bundle/macos/tau.app \
            "$RUNNER_TEMP/tau-app" "$VERSION"
          plutil -p src-tauri/target/universal-apple-darwin/release/bundle/macos/tau.app/Contents/Info.plist \
            | grep -E 'CFBundle(Identifier|ShortVersionString)|UsageDescription'

      - uses: actions/upload-artifact@v7
        with:
          name: tau-app
          path: ${{ runner.temp }}/tau-app/
          if-no-files-found: error

  release:
    name: Attach to the GitHub release
    needs: build
    if: github.event_name == 'push' || inputs.dry_run == false
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release when it is missing, and attach the files
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: tau-app
          path: tau-app
      - name: Upload to the release of the tag, creating it when release.yml has not yet
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          ls -l tau-app
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac # 0.5.0-rc1, ...
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # The same title and notes as release.yml. If release.yml creates it in the
            # meantime, this fails and the upload below attaches the files all the same.
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$GITHUB_REF_NAME" --generate-notes $prerelease \
              || echo "the release exists now; uploading to it"
          fi
          gh release upload "$GITHUB_REF_NAME" tau-app/* --clobber --repo "$GITHUB_REPOSITORY"

  downloads:
    name: Upload to the public downloads (R2)
    needs: build
    if: github.event_name == 'push' || inputs.dry_run == false
    runs-on: ubuntu-latest
    env:
      # `secrets` cannot be read in an `if:`; expose their presence through the environment.
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      BUCKET: tau-downloads
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Without the Cloudflare secrets, upload nothing
        if: env.HAS_CLOUDFLARE != 'true'
        run: |
          echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set: tau $VERSION is not uploaded to the R2 bucket $BUCKET, so https://tau.getporti.com/download and the updater do not offer it. docs/contributing/release.md says how to set them up."
      - uses: actions/download-artifact@v8
        if: env.HAS_CLOUDFLARE == 'true'
        with:
          name: tau-app
          path: tau-app
      - uses: oven-sh/setup-bun@v2
        if: env.HAS_CLOUDFLARE == 'true'
        with:
          bun-version: 1.3.2
      # Wrangler runs on Node (22 or later), which `bunx` starts through its shebang.
      - uses: actions/setup-node@v7
        if: env.HAS_CLOUDFLARE == 'true'
        with:
          node-version: 24
      - name: This release's files first, then the latest copies, latest.json last
        if: env.HAS_CLOUDFLARE == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          ls -l tau-app
          put() { # <key> <file> <content type>; a failed upload stops the step here
            echo "uploading $BUCKET/$1"
            bunx wrangler@4.144.0 r2 object put "$BUCKET/$1" --file "$2" --content-type "$3" --remote
          }
          put "v$VERSION/tau.dmg" tau-app/tau.dmg application/x-apple-diskimage
          put "v$VERSION/tau.app.tar.gz" tau-app/tau.app.tar.gz application/gzip
          case "$VERSION" in
            *-*)
              echo "::notice::$VERSION is a pre-release: only https://tau.getporti.com/download/v$VERSION/ has it; the latest copies stay as they are."
              exit 0
              ;;
          esac
          put tau.app.tar.gz tau-app/tau.app.tar.gz application/gzip
          put tau.dmg tau-app/tau.dmg application/x-apple-diskimage
          if [ -f tau-app/latest.json ]; then
            put latest.json tau-app/latest.json application/json
          else
            echo "::warning::no latest.json (the updater key is not set): installed apps are not offered $VERSION."
          fi
          echo "https://tau.getporti.com/download/tau.dmg is tau $VERSION now."
