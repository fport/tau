name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # no floating v10 tag is published
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv build --package tau-core
      - run: uv build --package tau-tui
      - run: uv build --package tau-guard

  desktop:
    # apps/tau-desktop (ADR 0008): vitest, the type-checked page build, and the Rust tests and
    # lints. Ubuntu is enough: Tauri compiles against WebKitGTK there, and the PTY tests only need
    # /bin/sh, stty, dd and od. The macOS bundle (`bun run tauri build`) is built by hand.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/tau-desktop
    steps:
      - uses: actions/checkout@v7
      - name: Install the WebKitGTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - run: bun install --frozen-lockfile
      - run: bun run test
      # tsc (the type check) and vite; it also makes the dist/ that Tauri's build script checks.
      - run: bun run build
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/tau-desktop/src-tauri/target/
          key: desktop-cargo-${{ runner.os }}-${{ hashFiles('apps/tau-desktop/src-tauri/Cargo.lock') }}
          restore-keys: desktop-cargo-${{ runner.os }}-
      - run: cargo test --locked
        working-directory: apps/tau-desktop/src-tauri
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: apps/tau-desktop/src-tauri

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # no floating v10 tag is published
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --only-group docs
      - run: uv run --no-sync mkdocs build --strict
