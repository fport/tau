[project]
name = "tau-cloud"
version = "0.1.0"
description = "tau's cloud mode: the spine session backend, config and persona sync with the spine, and the brain container's entrypoint."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["click>=8.1", "tau-core>=0.3.1", "tau-net>=0.1.0", "tomlkit>=0.13"]
keywords = ["tau", "agent", "assistant", "cloudflare", "containers", "d1", "sessions"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
]

[project.urls]
Homepage = "https://github.com/fport/tau"
Documentation = "https://docs.tau.getporti.com"
Issues = "https://github.com/fport/tau/issues"
Changelog = "https://github.com/fport/tau/releases"

[project.entry-points."tau.sessions"]
spine = "tau_cloud.sessions:make_store"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tau_cloud"]
