site_name: tau
site_description: A private-first personal "smart body" agent — install it, talk to it, let it touch the physical world under your approval.
site_url: https://docs.tau.getporti.com
repo_url: https://github.com/fport/tau
repo_name: tau
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
copyright: MIT

theme:
  name: material
  language: en
  logo: brand/tau-app-icon.svg
  favicon: brand/tau-coin.svg
  palette:
    scheme: slate
    primary: custom
    accent: custom
  font:
    text: IBM Plex Sans
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow

extra_css:
  - stylesheets/brand.css

plugins:
  - search:
      lang:
        - en
        - tr
  # Bilingual site (issue 147): page.md is English, page.tr.md its Turkish twin.
  # English is the default and the fallback; Turkish pages are served under /tr/.
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: tr
          name: Türkçe
          build: true
          site_description: Gizlilik öncelikli, kişisel bir "akıllı beden" ajanı. Kur, onunla konuş; fiziksel dünyaya yalnızca senin onayınla dokunsun.
          nav_translations:
            Home: Ana sayfa
            Getting started: Başlarken
            Three ways to start: Başlamanın üç yolu
            Build your own tau: Kendi tau'nu kur
            Try everything locally: Her şeyi yerelde dene
            Install: Kurulum
            First run: İlk çalıştırma
            Configure: Yapılandırma
            Talk to tau: tau ile konuş
            Guides: Rehberler
            Reach tau from your phone (Tailscale + Termius): Telefondan tau'ya ulaş (Tailscale + Termius)
            Private deployment (Cloudflare Tunnel + Access): Özel dağıtım (Cloudflare Tunnel + Access)
            Voice: Ses
            Owner guard: Sahip koruması
            Backups (encrypted, R2): Yedekler (şifreli, R2)
            Run tau as a service: tau'yu servis olarak çalıştır
            Models and budgets: Modeller ve bütçeler
            TauBar (macOS menu bar): TauBar (macOS menü çubuğu)
            Move the hub to a Raspberry Pi: Hub'ı Raspberry Pi'ye taşı
            Join the tau network: tau ağına katıl
            Public sub-taus with a web page: Web sayfalı açık sub-tau'lar
            Deploy your own host: Kendi kurulumunu yap
            Run tau in Cloudflare (cloud mode): tau'yu Cloudflare'de çalıştır (bulut modu)
            Reference: Referans
            Slash commands: Slash komutları
            Environment variables: Ortam değişkenleri
            Components and plugins: Bileşenler ve eklentiler
            Tiers and approvals: Tier'lar ve onaylar
            Owner guard reference: Sahip koruması referansı
            Sessions and compaction: Oturumlar ve sıkıştırma
            tau network protocol and spine API: tau ağı protokolü ve spine API'si
            tau universe protocol and the spine kit: tau evreni protokolü ve spine kiti
            Architecture: Mimari
            Decisions: Kararlar
            Threat model: Tehdit modeli
            ADRs: ADR'ler
            0001 Approval through Strands hooks: 0001 Strands hook'larıyla onay
            0002 tau.commands entry point: 0002 tau.commands giriş noktası
            0003 Session store: 0003 Oturum deposu
            0004 Config roots and persona privacy: 0004 Yapılandırma kökleri ve persona gizliliği
            0005 Components and entry-point groups: 0005 Bileşenler ve giriş noktası grupları
            0006 Private-first topology: 0006 Gizlilik öncelikli topoloji
            0007 Cloud mode and the tau network: 0007 Bulut modu ve tau ağı
            0008 The owner guard: 0008 Sahip koruması
            0009 Anthropic-only models behind the proxy: 0009 Proxy arkasında yalnızca Anthropic modelleri
            0010 The public site and the tau universe: 0010 Herkese açık site ve tau evreni
            0011 Budgets in tau, no LiteLLM: 0011 Bütçeler tau'da, LiteLLM yok
            0012 Sub-taus: 0012 Alt-tau'lar
            0013 Hosted taus, handles and public pages: 0013 Barındırılan tau'lar, kullanıcı adları ve açık sayfalar
            Contributing: Katkıda bulunma
            Development setup: Geliştirme ortamı
            Write a plugin: Eklenti yaz
            Roadmap and issues: Yol haritası ve issue'lar
            Releasing: Sürüm yayınlama
            Brand: Marka

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [".", "docs"]
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

exclude_docs: |
  agents/
  brand/render.py
  brand/README.md

