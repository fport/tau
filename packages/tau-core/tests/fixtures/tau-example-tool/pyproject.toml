[project]
name = "tau-example-tool"
version = "0.0.1"
description = "Test fixture: a tool shipped by a separate distribution through the tau.tools entry point."
requires-python = ">=3.12"
dependencies = ["tau-core"]

[project.entry-points."tau.tools"]
example = "tau_example_tool:TOOLS"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tau_example_tool"]
