[package]
name = "tau-app"
version = "0.1.0"
description = "tau, the Mac app: the menu bar, the hub's supervisor and chat windows running tau tui"
license = "MIT"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name.
name = "tau_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api`: the panel is a transparent window (`app.macOSPrivateApi` in tauri.conf.json).
tauri = { version = "2", features = ["image-png", "macos-private-api", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
# Updates from the GitHub release: latest.json and the signed .app.tar.gz (`update.rs`).
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
plist = "1"
signal-hook = "0.3"
# Chat windows: `tau tui` in a PTY per window (`chat/pty.rs`).
portable-pty = "0.9"
# Signed control requests (ADR 0008): HMAC-SHA256 over the nonce, method and path.
getrandom = "0.3"
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
keepawake = "0.6"
objc2 = "0.6"
objc2-foundation = "0.3"
# The menu bar icon stays pressed while the panel is open (`panel.rs`).
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSButton",
    "NSControl",
    "NSResponder",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSView",
] }
objc2-service-management = "0.3"

# Size guideline: https://tauri.app/concept/size/#cargo-configuration
# No `panic = "abort"`: the app must still stop its hub, restore sleep and quit the TUIs of its
# chat windows when a thread panics.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
