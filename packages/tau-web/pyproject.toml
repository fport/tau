[project]
name = "tau-web"
version = "0.1.0"
description = "tau's web app on the hub: the agent's turns streamed to paired browsers, with approvals, sessions and the turn protocol."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "pyjwt[crypto]>=2.8",
    "starlette>=0.40",
    "tau-core>=0.4.0",
    "uvicorn>=0.30",
]
keywords = ["tau", "agent", "assistant", "web", "chat", "hub", "strands"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
]

[project.urls]
Homepage = "https://github.com/fport/tau"
Documentation = "https://docs.tau.getporti.com"
Issues = "https://github.com/fport/tau/issues"
Changelog = "https://github.com/fport/tau/releases"

[project.entry-points."tau.commands"]
web = "tau_web.cli:web"

[project.entry-points."tau.hub_services"]
web = "tau_web.service:make_service"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tau_web"]
