name: cloud-shared

# cloud/shared holds TypeScript the Workers import by relative path: the tau network protocol's
# TypeScript half (net/, issue 158) and the turn protocol's (turn/, issue 177). Its tests run in
# workerd and in Node, and check them against the vectors tau-net and tau-core wrote
# (net/vectors.json, turn/vectors.json). The Python half of the check, including the freshness
# of both vectors files and tau-net's check of net/ts-vectors.json, runs in ci.yml's pytest.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud/shared
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2
      # bun installs and runs the scripts; Vitest, its Workers pool, Wrangler and the vectors
      # script run on Node, which `bun run` starts through their `#!/usr/bin/env node` shebangs.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('cloud/shared/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - name: A Worker bundles the shared modules (wrangler dry run)
        run: bun run bundle-check
