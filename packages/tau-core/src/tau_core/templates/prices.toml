# What the models cost, in US dollars per million tokens: data, not code (ADR 0011).
# tau prices every answer's token usage with this table to enforce the budgets in tau.toml.
# A model missing here counts as unpriced: `tau doctor` warns when a role with a budget uses
# one. tau.toml extends or overrides it with [models.prices."<model_id>"] tables.
# cache_read / cache_write default to input when left out. Sources: the providers' pricing
# pages on 2026-09-30; long-context surcharges (> 200k tokens) are not modelled.

