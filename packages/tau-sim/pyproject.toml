[project]
name = "tau-sim"
version = "0.1.0"
description = "Simulated devices for tau: a lamp the agent, the app and routines can drive before any real hardware is on hand."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["click>=8.1", "tau-core>=0.4.0"]
keywords = ["tau", "agent", "assistant", "simulation", "device", "home-automation", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
]

[project.urls]
Homepage = "https://github.com/fport/tau"
Documentation = "https://docs.tau.getporti.com"
Issues = "https://github.com/fport/tau/issues"
Changelog = "https://github.com/fport/tau/releases"

[project.entry-points."tau.commands"]
sim = "tau_sim.cli:sim"

[project.entry-points."tau.tools"]
sim = "tau_sim.tools:TOOLS"

[project.entry-points."tau.hub_services"]
sim = "tau_sim.service:make_service"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tau_sim"]
