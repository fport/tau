# tau — uzaktan erişim. infra/remote/sshd/tau.conf'tan üretildi; burayı değil onu düzenle,
# sonra ./setup-sudo.sh'ı tekrar çalıştır.

# Sadece anahtar ile giriş. macOS UsePAM'i açık getirdiği için keyboard-interactive de
# kapatılmalı; yoksa PAM üzerinden şifre sorulmaya devam eder.
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey
PermitEmptyPasswords no
PermitRootLogin no

# macOS'ta sshd launchd tarafından tüm arayüzlerde başlatılır, ListenAddress etkisizdir.
# Bu yüzden kaynağı burada kısıtlıyoruz: sadece bu kullanıcı, sadece tailnet ve localhost.
AllowUsers __USER__@__TAILNET_V4__ __USER__@__TAILNET_V6__ __USER__@127.0.0.1 __USER__@::1

MaxAuthTries 3
LoginGraceTime 30

# Telefon uykuya geçince ölü bağlantılar ~2 dakikada temizlensin.
ClientAliveInterval 30
ClientAliveCountMax 4

X11Forwarding no
AllowAgentForwarding no
# Telefondan -L ile dev server'a erişim için sadece yerel yönlendirme.
AllowTcpForwarding local
