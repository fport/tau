[package]
name = "tau-desktop"
version = "0.1.0"
description = "tau Desktop: tau tui in a native window (xterm.js + a PTY per window)"
license = "MIT"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name.
name = "tau_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
signal-hook = "0.3"

# Size guideline: https://tauri.app/concept/size/#cargo-configuration
# No `panic = "abort"`: a panicking thread must not skip the PTY shutdown of the other windows.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
