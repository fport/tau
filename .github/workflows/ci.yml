name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # no floating v10 tag is published
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv build --package tau-core
      - run: uv build --package tau-tui
      - run: uv build --package tau-guard

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # no floating v10 tag is published
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --only-group docs
      - run: uv run --no-sync mkdocs build --strict
