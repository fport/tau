# LiteLLM proxy for tau's model roles (roadmap 010, ADR 0007).
#
# Start it through ./proxy.sh (it passes the repo's .env with --env-file); never
# `pip install litellm`: the PyPI package was compromised in March 2026, so it only ever runs
# here, isolated in a container pinned by digest.
#
# Both images are multi-arch (linux/amd64 and linux/arm64), so the same file runs on the Mac
# hub today and on the RPi5 hub later. To upgrade, change tag and digest together and follow
# "Upgrading the image" in README.md.

name: tau-litellm

services:
  litellm:
    image: ghcr.io/berriai/litellm:v1.103.1@sha256:df15400b5b80925c45d3fd53f8f7a6c0eaa8a25a86833e1b358002e129018943
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    ports:
      # Loopback only: the hub never opens an inbound port (ADR 0006).
      - "127.0.0.1:${TAU_PROXY_PORT:-4000}:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?run ./proxy.sh init first}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?run ./proxy.sh init first}
      DATABASE_URL: postgresql://litellm:${TAU_PROXY_DB_PASSWORD:?run ./proxy.sh init first}@db:5432/litellm
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in .env}
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
      TAU_OLLAMA_URL: ${TAU_OLLAMA_URL:-http://host.docker.internal:11434}
      TAU_LOCAL_MODEL: ${TAU_LOCAL_MODEL:-ollama_chat/qwen3.5:9b}
      # Use the cost map bundled with this pinned image instead of fetching one from GitHub
      # at every start: spend (and so every budget) must not change under us.
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      # Models come from config.yaml only; nothing is added through the admin UI.
      STORE_MODEL_IN_DB: "False"
    extra_hosts:
      # Docker Desktop provides this name; on Linux (the RPi5 hub) it maps to the host.
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  db:
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    # No published port: only the proxy reaches the database, on the compose network.
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${TAU_PROXY_DB_PASSWORD:?run ./proxy.sh init first}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d litellm -U litellm"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  db:
    name: tau-litellm-db
