[project]
name = "tau-net"
version = "0.1.0"
description = "The tau network: identity keys, signed and sealed envelopes, contacts, the net hub service, owner tools and the tau net command."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["click>=8.1", "cryptography>=44", "tau-core>=0.3.1"]
keywords = ["tau", "agent", "assistant", "federation", "ed25519", "x25519", "cloudflare"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications",
    "Topic :: Home Automation",
]

[project.urls]
Homepage = "https://github.com/fport/tau"
Documentation = "https://docs.tau.getporti.com"
Issues = "https://github.com/fport/tau/issues"
Changelog = "https://github.com/fport/tau/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tau_net"]
