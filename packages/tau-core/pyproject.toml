[project]
name = "tau-core"
version = "0.5.0"
description = "tau's agent core: build_agent, persona, tiers, roles, sessions and the tau CLI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "strands-agents[anthropic,openai,gemini]>=1.57,<1.58",
    "click>=8.1",
    "rich>=13",
    "python-dotenv>=1.0",
    "tomlkit>=0.13",
]
keywords = ["tau", "agent", "assistant", "llm", "strands", "cli", "home-automation", "robot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
]

[project.urls]
Homepage = "https://github.com/fport/tau"
Documentation = "https://docs.tau.getporti.com"
Issues = "https://github.com/fport/tau/issues"
Changelog = "https://github.com/fport/tau/releases"

[project.scripts]
tau = "tau_core.cli:main"

[project.entry-points."tau.tools"]
builtin = "tau_core.builtin_tools:TOOLS"
routines = "tau_core.routines.tools:TOOLS"
sim = "tau_core.sim.tools:TOOLS"

[project.entry-points."tau.commands"]
chat = "tau_core.channels.terminal:chat"
hub = "tau_core.hub.cli:hub"
telegram = "tau_core.channels.telegram_cli:telegram"
components = "tau_core.builder:components"
doctor = "tau_core.builder:doctor"
init = "tau_core.builder:init"
remote = "tau_core.remote.cli:remote"
setup = "tau_core.setup.cli:setup"
spend = "tau_core.spend:spend_command"
routine = "tau_core.routines.cli:routine"
sim = "tau_core.sim.cli:sim"

[project.entry-points."tau.context"]
budget = "tau_core.spend:context_source"

[project.entry-points."tau.hub_services"]
telegram = "tau_core.channels.telegram:make_service"
spend = "tau_core.spend:make_service"
routines = "tau_core.routines.service:make_service"
sim = "tau_core.sim.service:make_service"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tau_core"]
# The remote kit (a copy of infra/remote, kept equal by a test) is package data for
# `tau remote ssh`. Listed as artifacts so no ignore rule can ever drop it.
artifacts = ["src/tau_core/remote/kit/**"]

[tool.hatch.build.targets.sdist]
exclude = ["tests/fixtures"]
artifacts = ["src/tau_core/remote/kit/**"]
