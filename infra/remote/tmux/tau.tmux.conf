# tau — tmux settings (~/.tmux.conf sources this file). Use from the phone comes first.

set -g default-terminal "tmux-256color"
# No RGB override for xterm-256color: Termius over mosh drops 24-bit colour, so the TUI came
# out black and white. Without the override tmux maps 24-bit colour to the 256-colour palette
# for such clients and passes it through to terminals it recognises as truecolor (iTerm2,
# Ghostty, WezTerm, kitty). A local truecolor terminal it does not recognise: tmux -T RGB attach.
set -s escape-time 10
set -g focus-events on
set -g history-limit 50000
set -g set-clipboard on

# Finger scrolling and pane selection in Termius.
set -g mouse on
# When the phone and the Mac are attached at the same time, fit the window to each client's size.
setw -g aggressive-resize on

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

bind r source-file ~/.tmux.conf \; display-message "tmux settings reloaded"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

set -g status-interval 5
set -g status-style "bg=default,fg=colour245"
set -g status-left "#[fg=colour214,bold] τ #S #[default]"
set -g status-left-length 20
set -g status-right "#{?client_prefix,#[fg=colour214]PREFIX ,}#h %H:%M"
setw -g window-status-current-style "fg=colour214,bold"
