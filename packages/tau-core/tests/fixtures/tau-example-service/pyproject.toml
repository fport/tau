[project]
name = "tau-example-service"
version = "0.0.1"
description = "Test fixture: a hub service and a context source shipped by a separate distribution through the tau.hub_services and tau.context entry points."
requires-python = ">=3.12"
dependencies = ["tau-core"]

[project.entry-points."tau.hub_services"]
example = "tau_example_service:make_service"

[project.entry-points."tau.context"]
example = "tau_example_service:make_context_source"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tau_example_service"]
