# tau — tmux ayarları (~/.tmux.conf buradan source eder). Telefondan kullanım öncelikli.

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -s escape-time 10
set -g focus-events on
set -g history-limit 50000
set -g set-clipboard on

# Termius'ta parmakla kaydırma ve pane seçimi.
set -g mouse on
# Telefon ve Mac aynı anda bağlıyken pencere her istemcinin boyutuna uysun.
setw -g aggressive-resize on

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

bind r source-file ~/.tmux.conf \; display-message "tmux ayarları yenilendi"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

set -g status-interval 5
set -g status-style "bg=default,fg=colour245"
set -g status-left "#[fg=colour214,bold] τ #S #[default]"
set -g status-left-length 20
set -g status-right "#{?client_prefix,#[fg=colour214]PREFIX ,}#h %H:%M"
setw -g window-status-current-style "fg=colour214,bold"
