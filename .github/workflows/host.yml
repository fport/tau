name: host

# tau-host (cloud/host): the generated data is fresh, the Worker and the app typecheck, the
# tests pass in the Workers runtime, and the app builds. Nothing is deployed from here.
#
# src/generated/ is made from tau-core's templates (models.toml, prices.toml, persona.md) by
# `bun run generate`, so a change to those templates runs this workflow too.

on:
  push:
    branches: [main]
    paths:
      - "cloud/host/**"
      - "cloud/shared/**"
      - "packages/tau-core/src/tau_core/templates/**"
      - ".github/workflows/host.yml"
  pull_request:
    paths:
      - "cloud/host/**"
      - "cloud/shared/**"
      - "packages/tau-core/src/tau_core/templates/**"
      - ".github/workflows/host.yml"

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud/host
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2
      # bun installs and runs the scripts; Vitest, its Workers pool and Wrangler run on Node,
      # which `bun run` starts through their `#!/usr/bin/env node` shebangs.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('cloud/host/bun.lock', 'cloud/shared/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      # The postinstall installs cloud/shared's dependencies too (tau-host imports cloud/shared/net).
      - run: bun install --frozen-lockfile
      - name: The generated files match tau-core's templates
        run: bun run check-generated
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
