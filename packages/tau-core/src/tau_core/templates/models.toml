# Model ids `tau init` writes into tau.toml for the brain and fast roles of the provider it picks.
# Data, not code: tau-core never names a model id in Python. Their prices are in tau-core's
# prices.toml. The local role stays on Ollama whatever provider is picked. Anthropic, OpenAI and
# Gemini ids are the APIs' own; Bedrock ids use the Converse form with the "global." prefix.
[anthropic]
brain = "claude-sonnet-5"
fast = "claude-haiku-4-5"

[openai]
brain = "gpt-6.1-sol"
fast = "gpt-6-luna"

[gemini]
brain = "gemini-3.5-flash"
fast = "gemini-3.1-flash-lite"

[bedrock]
brain = "global.anthropic.claude-sonnet-5"
fast = "global.anthropic.claude-haiku-4-5"

[fake]
brain = "fake-brain"
fast = "fake-fast"
