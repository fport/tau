# tau — remote access. Generated from infra/remote/sshd/tau.conf; edit that file, not this one,
# then run ./setup-sudo.sh again.

# Key-only login. macOS ships with UsePAM on, so keyboard-interactive must be off too;
# otherwise PAM keeps asking for a password.
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey
PermitEmptyPasswords no
PermitRootLogin no

# On macOS launchd starts sshd on every interface and ListenAddress has no effect.
# So the source is restricted here: only this user, only from the tailnet and localhost.
AllowUsers __USER__@__TAILNET_V4__ __USER__@__TAILNET_V6__ __USER__@127.0.0.1 __USER__@::1

MaxAuthTries 3
LoginGraceTime 30

# Clean up dead connections within ~2 minutes once the phone goes to sleep.
ClientAliveInterval 30
ClientAliveCountMax 4

X11Forwarding no
AllowAgentForwarding no
# Only local forwarding, for reaching a dev server from the phone with -L.
AllowTcpForwarding local
