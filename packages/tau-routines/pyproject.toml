[project]
name = "tau-routines"
version = "0.1.0"
description = "Routines for tau: one tool call with fixed arguments on a clock, approved once at registration and run by the hub without a model, the cloud or the owner at the Mac."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["click>=8.1", "strands-agents>=1.57", "tau-core>=0.4.0"]
keywords = ["tau", "agent", "routine", "schedule", "reflex", "home-automation", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
]

[project.urls]
Homepage = "https://github.com/fport/tau"
Documentation = "https://docs.tau.getporti.com"
Issues = "https://github.com/fport/tau/issues"
Changelog = "https://github.com/fport/tau/releases"

[project.entry-points."tau.hub_services"]
routines = "tau_routines.service:make_service"

[project.entry-points."tau.commands"]
routine = "tau_routines.cli:routine"

[project.entry-points."tau.tools"]
routines = "tau_routines.tools:TOOLS"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tau_routines"]
