[project]
name = "tau-workspace"
version = "0.0.0"
description = "uv workspace root for the tau monorepo (not published)."
requires-python = ">=3.12"
dependencies = ["tau-core", "tau-tui"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "packages/tau-core/tests/fixtures/tau-example-tool"]

[tool.uv.sources]
tau-core = { workspace = true }
tau-tui = { workspace = true }
tau-example-tool = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-textual-snapshot", "ruff", "tau-example-tool"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Standalone repo scripts (issue board, brand renderer) predate the workspace and keep their style.
extend-exclude = ["docs", "roadmap"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages"]
addopts = "--import-mode=importlib"
