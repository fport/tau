[project]
name = "tau-tui"
version = "0.1.0"
description = "Textual terminal UI for tau: chat pane, live event pane and in-TUI approvals."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["tau-core>=0.1.0", "textual>=8"]

[project.entry-points."tau.commands"]
tui = "tau_tui.cli:tui"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tau_tui"]
