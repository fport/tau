# LiteLLM proxy configuration for tau (roadmap 010-012, ADR 0007).
#
# Each model group is one of tau's roles. tau.toml points a role at its group with
# `provider = "proxy"` and `model_id = "<group>"`, and every role calls with its own virtual
# key (`tau proxy keys` creates them with the budgets from tau.toml). Model ids live here and
# in tau.toml, never in code.

model_list:
  - model_name: brain
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
      num_retries: 1
      timeout: 300

  - model_name: fast
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY
      num_retries: 1
      timeout: 120

  # Ollama on the Mac. TAU_LOCAL_MODEL is "ollama_chat/<ollama model name>"; TAU_OLLAMA_URL
  # defaults to the Docker host (the Mac itself) and points at the Mac over the tailnet once
  # the hub runs elsewhere. A Mac that is asleep or away must fail fast, so no retries and a
  # short timeout: the router then falls back to `fast`.
  - model_name: local
    litellm_params:
      model: os.environ/TAU_LOCAL_MODEL
      api_base: os.environ/TAU_OLLAMA_URL
      think: false                  # thinking models (qwen3.5) answer in ~2 s instead of reasoning first
      num_retries: 0
      timeout: 120
      stream_timeout: 20

router_settings:
  # brain has no second provider since Bedrock was dropped (ADR 0007): when Anthropic refuses
  # the Sonnet call (overloaded, 5xx), Haiku answers instead. local falls back to fast when
  # Ollama is unreachable (012). A spent budget is not a fallback case: the proxy refuses the
  # key before routing, and tau decides what happens (tau.toml `degrade_to`, 011).
  fallbacks:
    - brain: ["fast"]
    - local: ["fast"]
  allowed_fails: 1
  cooldown_time: 30

litellm_settings:
  drop_params: true
  # Prompts and replies are life data (ADR 0006): the spend log keeps costs, never contents.
  turn_off_message_logging: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_prompts_in_spend_logs: false
