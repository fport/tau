name: docs

# Builds the MkDocs Material site (strict: a broken link or a missing page fails the build)
# and deploys it as Cloudflare Workers static assets (the successor of Cloudflare Pages):
# Worker `tau-docs`, config in infra/docs/wrangler.jsonc, served at https://docs.tau.getporti.com
# once the domain is on Cloudflare (until then at the account's workers.dev subdomain).
#
# One-time setup by the owner (details in docs/contributing/release.md):
#   1. First deploy from a shell with a logged-in wrangler (creates the Worker):
#        uv run --group docs mkdocs build --strict && npx wrangler deploy -c infra/docs/wrangler.jsonc
#   2. On the Worker: Settings -> Domains & Routes -> add `docs.tau.getporti.com` (the zone is
#      on Cloudflare, so the DNS record is added for you).
#   3. An API token (My Profile -> API Tokens -> Create -> "Edit Cloudflare Workers" template,
#      or a custom one with Account > Workers Scripts > Edit) -> repository secret
#      CLOUDFLARE_API_TOKEN; the account id (dashboard sidebar) -> repository secret
#      CLOUDFLARE_ACCOUNT_ID.
# Without those two secrets (forks, dry runs) the workflow only builds the site and keeps it
# as an artifact.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to Cloudflare (needs the secrets); off = build only"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and deploy the site
    runs-on: ubuntu-latest
    env:
      # `secrets` cannot be read in an `if:`; expose their presence through the environment.
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # same pin as ci.yml (no floating v10 tag is published)
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --only-group docs
      - run: uv run --no-sync mkdocs build --strict
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: site/
          if-no-files-found: error

      - name: Deploy to Cloudflare (Workers static assets)
        if: env.HAS_CLOUDFLARE == 'true' && (github.event_name == 'push' || inputs.deploy)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Every deploy from main replaces the production Worker; the config is versioned in the repo.
          command: deploy -c infra/docs/wrangler.jsonc
